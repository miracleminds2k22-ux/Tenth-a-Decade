<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organiser Panel | TENTH — A DECADE</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===================== LOCK SCREEN ===================== -->
<div class="lock-screen" id="lockScreen">
  <div class="brand-mini">TENTH — <span>A DECADE</span></div>
  <h1>Organiser Access</h1>
  <input type="password" class="lock-input" id="pwInput" placeholder="Enter password" autocomplete="off">
  <button class="btn" onclick="tryLogin()">Unlock Panel</button>
  <div class="error-text" id="pwError"></div>
</div>

<!-- ===================== ADMIN PANEL ===================== -->
<div class="shell admin-panel" id="adminPanel">

  <div class="topbar">
    <div class="brand-mini">TENTH — <span>A DECADE</span> · ORGANISER</div>
    <button class="btn btn-ghost" style="width:auto;padding:8px 16px;" onclick="logout()">Lock</button>
  </div>

  <!-- Current event + announcement -->
  <div class="section-head"><h2>Broadcast</h2></div>
  <div class="info-grid" style="grid-template-columns:1fr 1fr;">
    <div class="info-box">
      <div class="label">Current Event</div>
      <input type="text" id="eventInput" class="lock-input" style="margin-top:8px;text-align:left;" placeholder="e.g. Balloon Relay">
      <button class="btn" style="margin-top:8px;" onclick="setCurrentEvent()">Update</button>
    </div>
    <div class="info-box">
      <div class="label">Announcement</div>
      <input type="text" id="announceInput" class="lock-input" style="margin-top:8px;text-align:left;" placeholder="e.g. Lunch break — 15 mins">
      <button class="btn" style="margin-top:8px;" onclick="postAnnouncement()">Publish</button>
    </div>
  </div>

  <!-- Score controls -->
  <div class="section-head"><h2>Scores</h2><div class="hint">Taps update live instantly</div></div>
  <div id="scoreBlocks"></div>

  <div class="admin-actions">
    <button class="btn btn-ghost" onclick="undoLast()">↺ Undo Last Update</button>
    <button class="btn btn-ghost" onclick="confirmReset()">Reset Tournament</button>
  </div>

  <!-- Team info editor -->
  <div class="section-head"><h2>Edit Team Info</h2></div>
  <div id="editBlocks"></div>

  <!-- History -->
  <div class="section-head"><h2>Score History</h2></div>
  <div id="historyLog"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="app.js"></script>
<script>
  /* =============================================================
     CHANGE THIS PASSWORD before the event.
     This is a simple lock for organisers only — not bank-grade
     security, but combined with Firebase rules it keeps casual
     guests from editing scores.
     ============================================================= */
  const ADMIN_PASSWORD = "batch2017";

  function tryLogin() {
    const val = document.getElementById('pwInput').value;
    if (val === ADMIN_PASSWORD) {
      sessionStorage.setItem('tenth_admin', 'true');
      showPanel();
    } else {
      document.getElementById('pwError').textContent = 'Incorrect password. Try again.';
    }
  }
  function logout() {
    sessionStorage.removeItem('tenth_admin');
    location.reload();
  }
  function showPanel() {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    initAdmin();
  }
  document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  if (sessionStorage.getItem('tenth_admin') === 'true') showPanel();

  /* ---------------- Score controls ---------------- */
  const POINT_OPTIONS = [10, 7, 5, 2, 1];

  function initAdmin() {
    const scoreWrap = document.getElementById('scoreBlocks');
    const editWrap = document.getElementById('editBlocks');
    scoreWrap.innerHTML = '';
    editWrap.innerHTML = '';

    TEAM_ORDER.forEach(key => {
      const meta = TEAM_META[key];

      // Score block
      const block = document.createElement('div');
      block.className = 'admin-team-block';
      block.style.setProperty('--team-color', meta.color);
      block.innerHTML = `
        <div class="row-top">
          <div class="tname">${meta.name}</div>
          <div class="tpoints" id="pts-${key}">0</div>
        </div>
        <div class="point-btns">
          ${POINT_OPTIONS.map(p => `<button class="pbtn custom" onclick="addPoints('${key}', ${p})">+${p}</button>`).join('')}
          <button class="pbtn minus" onclick="addPoints('${key}', -5)">−5</button>
          <button class="pbtn minus" onclick="addPoints('${key}', -1)">−1</button>
        </div>
      `;
      scoreWrap.appendChild(block);

      // Edit block
      const edit = document.createElement('div');
      edit.className = 'admin-team-block';
      edit.style.setProperty('--team-color', meta.color);
      edit.innerHTML = `
        <div class="row-top"><div class="tname">${meta.name}</div></div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <input type="text" class="lock-input" style="text-align:left;" id="cap-${key}" placeholder="Captain name">
          <input type="text" class="lock-input" style="text-align:left;" id="chant-${key}" placeholder="Team chant">
          <textarea class="lock-input" style="text-align:left;min-height:70px;" id="mem-${key}" placeholder="Members, comma separated"></textarea>
          <button class="btn btn-ghost" onclick="saveTeamInfo('${key}')">Save ${meta.name} Info</button>
        </div>
      `;
      editWrap.appendChild(edit);
    });

    db.ref('teams').on('value', snap => {
      const teams = snap.val();
      if (!teams) return;
      TEAM_ORDER.forEach(key => {
        const t = teams[key] || {};
        const ptsEl = document.getElementById('pts-' + key);
        if (ptsEl) ptsEl.textContent = t.points || 0;
        const capEl = document.getElementById('cap-' + key);
        if (capEl && document.activeElement !== capEl) capEl.value = t.captain || '';
        const chantEl = document.getElementById('chant-' + key);
        if (chantEl && document.activeElement !== chantEl) chantEl.value = t.chant || '';
        const memEl = document.getElementById('mem-' + key);
        if (memEl && document.activeElement !== memEl) memEl.value = (t.members || []).join(', ');
      });
    });

    db.ref('history').limitToLast(20).on('value', snap => {
      const log = document.getElementById('historyLog');
      log.innerHTML = '';
      const items = [];
      snap.forEach(child => items.push(child.val()));
      items.reverse().forEach(item => {
        const row = document.createElement('div');
        row.className = 'history-item';
        const positive = item.delta > 0;
        row.innerHTML = `
          <div class="time">${fmtTime(item.time)}</div>
          <div class="desc">${TEAM_META[item.team]?.name || item.team}</div>
          <div class="delta" style="color:${positive ? 'var(--green)' : 'var(--red)'}">${positive ? '+' : ''}${item.delta}</div>
        `;
        log.appendChild(row);
      });
    });
  }

  function addPoints(teamKey, delta) {
    const ref = db.ref('teams/' + teamKey + '/points');
    ref.once('value').then(snap => {
      const current = snap.val() || 0;
      const next = Math.max(0, current + delta);
      ref.set(next);
      db.ref('lastAction').set({ team: teamKey, delta, prevValue: current, time: Date.now() });
      db.ref('history').push({ team: teamKey, delta, time: Date.now() });
    });
  }

  function undoLast() {
    db.ref('lastAction').once('value').then(snap => {
      const action = snap.val();
      if (!action) return alert('Nothing to undo.');
      db.ref('teams/' + action.team + '/points').set(action.prevValue);
      db.ref('history').push({ team: action.team, delta: -action.delta, time: Date.now(), note: 'undo' });
      db.ref('lastAction').remove();
    });
  }

  function confirmReset() {
    if (!confirm('This resets ALL team points to 0. Continue?')) return;
    if (!confirm('Really sure? This cannot be undone.')) return;
    TEAM_ORDER.forEach(key => db.ref('teams/' + key + '/points').set(0));
    db.ref('history').remove();
    db.ref('lastAction').remove();
  }

  function saveTeamInfo(key) {
    const captain = document.getElementById('cap-' + key).value.trim();
    const chant = document.getElementById('chant-' + key).value.trim();
    const members = document.getElementById('mem-' + key).value
      .split(',').map(m => m.trim()).filter(Boolean);
    db.ref('teams/' + key).update({ captain, chant, members });
  }

  function setCurrentEvent() {
    const name = document.getElementById('eventInput').value.trim();
    if (!name) return;
    db.ref('currentEvent').set({ name, time: Date.now() });
    document.getElementById('eventInput').value = '';
  }

  function postAnnouncement() {
    const text = document.getElementById('announceInput').value.trim();
    if (!text) return;
    db.ref('announcements').push({ text, time: Date.now() });
    document.getElementById('announceInput').value = '';
  }
</script>
</body>
</html>
