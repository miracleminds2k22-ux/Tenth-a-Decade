<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TENTH — A DECADE | Live Championship</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="shell">

  <div class="topbar">
    <div class="brand-mini">TENTH — <span>A DECADE</span></div>
    <div class="live-pill"><span class="live-dot"></span> LIVE</div>
  </div>

  <div class="hero">
    <div class="hero-title">TEAM<br><em>CHAMPIONSHIP</em></div>
    <div class="hero-sub">A Decade of Memories · A Lifetime of Friendship</div>
  </div>

  <div class="status-strip">
    <div class="status-card">
      <div class="label">Date</div>
      <div class="value" id="statDate">—</div>
    </div>
    <div class="status-card">
      <div class="label">Time</div>
      <div class="value" id="statTime">—</div>
    </div>
    <div class="status-card">
      <div class="label">Current Event</div>
      <div class="value gold" id="statCurrent">Not started</div>
    </div>
    <div class="status-card">
      <div class="label">Games Played</div>
      <div class="value" id="statGames">0</div>
    </div>
  </div>

  <div class="section-head">
    <h2>Leaderboard</h2>
    <div class="hint">Tap a team for details</div>
  </div>

  <div class="leaderboard" id="leaderboard">
    <!-- team cards injected by JS -->
  </div>

  <div class="foot-nav">
    <a href="admin.html">Organiser Panel</a>
    <a href="https://miracleminds2k22-ux.github.io/Tenth-a-Decade/">Registration Site</a>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="app.js"></script>
<script>
  // ---- Clock ----
  function tickClock() {
    const now = new Date();
    document.getElementById('statDate').textContent = now.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    document.getElementById('statTime').textContent = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  }
  tickClock();
  setInterval(tickClock, 1000 * 15);

  // ---- Current event ----
  db.ref('currentEvent').on('value', snap => {
    const val = snap.val();
    document.getElementById('statCurrent').textContent = val && val.name ? val.name : 'Not started';
  });

  // ---- Games played count ----
  db.ref('games').on('value', snap => {
    let count = 0;
    snap.forEach(g => { if (g.val().status === 'completed') count++; });
    document.getElementById('statGames').textContent = count;
  });

  // ---- Leaderboard render ----
  const board = document.getElementById('leaderboard');
  const prevPoints = {};

  function renderLeaderboard(teams) {
    const sorted = TEAM_ORDER
      .map(key => ({ key, ...teams[key] }))
      .sort((a, b) => (b.points || 0) - (a.points || 0));

    const maxPoints = Math.max(1, ...sorted.map(t => t.points || 0));

    board.innerHTML = '';
    sorted.forEach((team, i) => {
      const meta = TEAM_META[team.key];
      const points = team.points || 0;
      const changed = prevPoints[team.key] !== undefined && prevPoints[team.key] !== points;
      prevPoints[team.key] = points;

      const card = document.createElement('a');
      card.href = `team.html?team=${team.key}`;
      card.className = `team-card rank-${i + 1}`;
      card.style.setProperty('--team-color', meta.color);
      card.style.order = i;
      card.innerHTML = `
        <div class="rank-badge">${rankLabel(i)}</div>
        <div class="team-dot"></div>
        <div class="team-info">
          <div class="tname">${meta.name}</div>
          <div class="tbar-track"><div class="tbar-fill" style="width:${(points / maxPoints) * 100}%"></div></div>
        </div>
        <div class="team-points${changed ? ' bump' : ''}">${points}</div>
      `;
      board.appendChild(card);
    });
    board.style.display = 'flex';
    board.style.flexDirection = 'column';
  }

  db.ref('teams').on('value', snap => {
    const teams = snap.val();
    if (teams) renderLeaderboard(teams);
  });
</script>
</body>
</html>
